name: CI

on:
    push:
        branches:
            - "master"
    pull_request:
        types: [ready_for_review, synchronize, opened]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 10

            - uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install

            - name: Lint
              run: pnpm run lint

            - name: Build
              run: pnpm run build
