name: CI

on:
    push:
        branches:
            - "master"
    pull_request:
        types: [ready_for_review, synchronize, opened]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"

            - name: Install
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build
